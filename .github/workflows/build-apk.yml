name: build-apk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: 内嵌 Tailscale + 打包 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # gomobile 需要用 NDK 交叉编译 Go 代码
      - name: 安装 NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973" | tail -3
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      # 固定 Go 版本：用 stable+check-latest 会让版本随时间漂移，
      # 一旦版本号变了 ~/.cache/go-build 缓存就全部失效，导致每次重编。
      # 与 go.mod 保持一致即可，升级时手动改这里 + go.mod。
      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false

      # Go 模块缓存：tailscale.com 依赖树很大，不缓存的话每次都要重下
      - name: 缓存 Go 模块
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.mod') }}-v2
          restore-keys: |
            go-${{ runner.os }}-

      # gomobile bind 每次要 ~77s（3 个 ABI 交叉编译 + 链接）。
      # Go 侧代码没变时直接复用上次的 AAR，只有 bridge/*.go、go.mod、go.sum
      # 变化才重编。日常改 Kotlin 代码（绝大多数情况）可整段跳过。
      - name: 缓存 Tailscale 桥 AAR
        id: bridge-cache
        uses: actions/cache@v4
        with:
          path: app/libs/bridge.aar
          key: bridge-aar-${{ runner.os }}-${{ hashFiles('bridge/**', 'go.mod', 'go.sum', 'build-aar.sh') }}

      - name: Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 升级 Tailscale = 改 go.mod 里的版本（或本地跑 ./build-aar.sh --upgrade），Kotlin 侧永远不用动
      # 只编 App 实际用到的两个 ABI：arm64-v8a / x86_64。
      # 原来的 android/arm(32位) 对应 armeabi-v7a，被 abiFilters 过滤掉，纯属白编。
      - name: 编译 Tailscale 桥（gomobile → AAR）
        if: steps.bridge-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x build-aar.sh
          ABIS=android/arm64,android/amd64 ./build-aar.sh
        env:
          GOFLAGS: -mod=mod

      # 首次构建会把 tailscale.com 的版本解析出来。把它提交回去，
      # 之后每次构建就用同一个版本（可复现）；要升级就手动跑一次 build-aar.sh --upgrade。
      - name: 锁定依赖版本
        if: github.ref == 'refs/heads/main' && hashFiles('go.sum') != ''
        run: |
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "chore(deps): 锁定 Tailscale 依赖版本"
            git push
          else
            echo "依赖版本无变化"
          fi

      - name: 打包 APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/NasDrop-${GITHUB_SHA:0:7}.apk"
          ls -lh out

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: NasDrop-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: 发布或更新 Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "NasDrop v1.0.${{ github.run_number }}"
          files: out/*.apk
          generate_release_notes: true
