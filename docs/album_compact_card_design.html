<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全部相册卡片精简方案对比</title>
<style>
  :root {
    --bg-page: #0f172a;
    --card-bg: #1e293b;
    --primary: #38bdf8;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-page);
    color: var(--text-main);
    padding: 30px 20px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 8px; color: #fff; }
  p.subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }

  .comparison-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 24px;
  }
  .option-card {
    background: var(--card-bg);
    border-radius: 18px;
    padding: 20px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .option-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
  .tag.current { background: rgba(239, 68, 68, 0.15); color: #f87171; }
  .tag.rec { background: rgba(56, 189, 248, 0.15); color: var(--primary); }
  .tag.alt { background: rgba(52, 211, 153, 0.15); color: #34d399; }
  .option-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; min-height: 36px; }

  /* 模拟手机卡片容器 */
  .preview-box {
    background: #090d16;
    border-radius: 14px;
    padding: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* 当前三行样式 */
  .current-card {
    background: #182234;
    border-radius: 16px;
    padding: 14px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .current-row1 { display: flex; justify-content: space-between; align-items: flex-start; }
  .thumb-box {
    width: 46px; height: 46px; border-radius: 12px;
    background: linear-gradient(135deg, #f59e0b, #d97706);
  }
  .more-btn { color: var(--text-muted); font-size: 16px; cursor: pointer; }
  .current-row2 { margin-top: 12px; font-size: 15px; font-weight: 700; color: #fff; }
  .current-row3 { margin-top: 4px; font-size: 12px; color: var(--text-muted); }

  /* 方案1：紧凑两行 (合并标题与张数) */
  .opt1-card {
    background: #182234;
    border-radius: 14px;
    padding: 12px;
    border: 1px solid rgba(56, 189, 248, 0.25);
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .opt1-row1 { display: flex; justify-content: space-between; align-items: center; }
  .thumb-box-sm {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(135deg, #f59e0b, #d97706);
  }
  .opt1-row2 {
    margin-top: 10px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .opt1-title { font-size: 14px; font-weight: 700; color: #fff; }
  .opt1-count { font-size: 11px; color: var(--primary); font-weight: 600; background: rgba(56,189,248,0.12); padding: 1px 6px; border-radius: 4px; }

  /* 方案2：极简左右横排单行流 */
  .opt2-card {
    background: #182234;
    border-radius: 12px;
    padding: 10px 12px;
    border: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .opt2-center { flex: 1; min-width: 0; }
  .opt2-title { font-size: 13.5px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opt2-count { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>

<div class="container">
  <h1>全部相册卡片视觉精简重构提案</h1>
  <p class="subtitle">针对“三行显示较占地方”的问题，对比当前样式与精简方案</p>

  <div class="comparison-grid">
    <!-- 当前现状 -->
    <div class="option-card">
      <div class="option-title">
        <span>当前样式</span>
        <span class="tag current">现状：占地 126dp</span>
      </div>
      <div class="option-desc">图、名、数各占一行，垂直空隙大，单屏展示数量较少</div>
      <div class="preview-box">
        <div class="current-card">
          <div class="current-row1">
            <div class="thumb-box"></div>
            <div class="more-btn">⋮</div>
          </div>
          <div class="current-row2">旅行记忆</div>
          <div class="current-row3">2 张照片</div>
        </div>
      </div>
    </div>

    <!-- 方案 1：精简两行双列卡片（推荐） -->
    <div class="option-card">
      <div class="option-title">
        <span>方案 1：紧凑两行流</span>
        <span class="tag rec">强烈推荐：高度直降 35%</span>
      </div>
      <div class="option-desc">上层图与菜单，下层相册名+微胶囊张数，两行收拢，精致利落</div>
      <div class="preview-box">
        <div class="opt1-card">
          <div class="opt1-row1">
            <div class="thumb-box-sm"></div>
            <div class="more-btn">⋮</div>
          </div>
          <div class="opt1-row2">
            <span class="opt1-title">旅行记忆</span>
            <span class="opt1-count">2张</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 方案 2：横向图文左右并排 -->
    <div class="option-card">
      <div class="option-title">
        <span>方案 2：横向图文同行</span>
        <span class="tag alt">高度直降 45%</span>
      </div>
      <div class="option-desc">左侧封面，右侧上下排列名称与数量，最右菜单，极致省空间</div>
      <div class="preview-box">
        <div class="opt2-card">
          <div class="thumb-box-sm"></div>
          <div class="opt2-center">
            <div class="opt2-title">旅行记忆</div>
            <div class="opt2-count">2 张照片</div>
          </div>
          <div class="more-btn">⋮</div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
